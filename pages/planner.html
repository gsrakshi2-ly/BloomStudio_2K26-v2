    <div class="planner-box">

        <h2>✨ Today's Tasks</h2>

        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you want to do today?">

            <button onclick="addTask()">
                ➕ Add
            </button>

        </div>

        <ul id="taskList"></ul>

    </div>

</section>
