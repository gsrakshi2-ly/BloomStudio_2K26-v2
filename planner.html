<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        🌸 Bloom Planner
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
    </nav>

</header>

<section class="hero">

    <h1>📅 My Planner</h1>

    <p>Plan your day beautifully.</p>

</section>

<section class="planner">

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a task...">

    <button onclick="addTask()">
        Add Task
    </button>

    <ul id="taskList"></ul>

</section>

<script src="planner.js"></script>

</body>
</html>
